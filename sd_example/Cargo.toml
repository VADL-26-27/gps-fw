[package]
name = "sd_example"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 's'
lto = true
debug = true
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
embedded-hal = "1.0"
nb = "1"
cortex-m = "0.7"
cortex-m-rt = "0.7"
# Panic behaviour, see https://crates.io/keywords/panic-impl for alternatives
panic-halt = "1.0"
panic-semihosting = "0.7"
static_cell = "2.1.1"
cortex-m-semihosting = "0.6"

[dependencies.stm32f4xx-hal]
version = "0.23.0"
features = ["stm32f446","sdio-host"] # replace the model of your microcontroller here
                                    # and add other required features

[[bin]]
name = "sd_example"
test = false
bench = false
